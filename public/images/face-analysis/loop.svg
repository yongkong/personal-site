<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; }
    .lbl { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .sub { fill: #475569; font-size: 11.5px; }
    .money { fill: #0369a1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#a); }
    .back { stroke: #0369a1; stroke-width: 2; fill: none; stroke-dasharray: 5 4; marker-end: url(#b); }
    .backTxt { fill: #0369a1; font-size: 11.5px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0369a1"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="50" width="150" height="88" rx="10"/>
  <text class="lbl" x="95" y="80" text-anchor="middle">免费报告</text>
  <text class="sub" x="95" y="102" text-anchor="middle">3 项：季型 / 脸型名</text>
  <text class="sub" x="95" y="120" text-anchor="middle">一句配色建议</text>

  <rect class="box" x="220" y="50" width="160" height="88" rx="10"/>
  <text class="money" x="300" y="82" text-anchor="middle">¥ 19.9</text>
  <text class="sub" x="300" y="104" text-anchor="middle">解锁完整 8 板块报告</text>
  <text class="sub" x="300" y="122" text-anchor="middle">米大师虚拟支付</text>

  <rect class="box" x="430" y="50" width="160" height="88" rx="10"/>
  <text class="lbl" x="510" y="80" text-anchor="middle">报告交付</text>
  <text class="sub" x="510" y="102" text-anchor="middle">小程序在线 + PDF 下载</text>
  <text class="sub" x="510" y="120" text-anchor="middle">专属色卡 · 行动清单</text>

  <rect class="box" x="640" y="50" width="150" height="88" rx="10"/>
  <text class="lbl" x="715" y="80" text-anchor="middle">私教预约</text>
  <text class="sub" x="715" y="102" text-anchor="middle">报告末尾 CTA</text>
  <text class="sub" x="715" y="120" text-anchor="middle">高意向线索转化</text>

  <line class="arrow" x1="170" y1="94" x2="216" y2="94"/>
  <line class="arrow" x1="380" y1="94" x2="426" y2="94"/>
  <line class="arrow" x1="590" y1="94" x2="636" y2="94"/>

  <rect class="box" x="220" y="196" width="270" height="72" rx="10"/>
  <text class="lbl" x="355" y="224" text-anchor="middle">退款审核（管理端）</text>
  <text class="sub" x="355" y="246" text-anchor="middle">人工审核 · 全量审计日志 · 同 IP 锁定防爆破</text>

  <!-- refund: unlock revoked back to paid report -->
  <path class="back" d="M 355 196 L 355 160 L 300 160 L 300 142"/>
  <text class="backTxt" x="368" y="178">审核通过 → 回收解锁</text>
</svg>
