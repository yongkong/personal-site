<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; rx: 10; }
    .step { fill: #0f172a; }
    .lbl { fill: #0f172a; font-size: 15px; font-weight: 600; }
    .sub { fill: #475569; font-size: 11.5px; }
    .mono { fill: #0369a1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; }
    .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#a); }
    .guard { fill: #fff; stroke: #0369a1; stroke-dasharray: 5 4; }
    .guardTxt { fill: #0369a1; font-size: 13px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect class="box" x="20" y="60" width="128" height="86" rx="10"/>
  <text class="lbl" x="84" y="94" text-anchor="middle">拍照</text>
  <text class="sub" x="84" y="116" text-anchor="middle">正脸 + 侧脸各 1 张</text>

  <!-- step 2 -->
  <rect class="box" x="188" y="60" width="148" height="86" rx="10"/>
  <text class="lbl" x="262" y="88" text-anchor="middle">端侧提取</text>
  <text class="sub" x="262" y="110" text-anchor="middle">wx.faceDetect · canvas 取帧</text>
  <text class="sub" x="262" y="128" text-anchor="middle">临时文件立即清理</text>

  <!-- step 3 -->
  <rect class="box" x="376" y="60" width="150" height="86" rx="10"/>
  <text class="lbl" x="451" y="88" text-anchor="middle">特征数据</text>
  <text class="sub" x="451" y="110" text-anchor="middle">106 关键点 + 3 区肤色 RGB</text>
  <text class="mono" x="451" y="130" text-anchor="middle">&lt; 1 KB</text>

  <!-- step 4 -->
  <rect class="box" x="566" y="60" width="140" height="86" rx="10"/>
  <text class="lbl" x="636" y="88" text-anchor="middle">后端分析</text>
  <text class="sub" x="636" y="110" text-anchor="middle">脸型 7 模板 · 三庭五眼</text>
  <text class="sub" x="636" y="128" text-anchor="middle">折叠度 · 四季季型</text>

  <!-- step 5 -->
  <rect class="box" x="746" y="60" width="134" height="86" rx="10"/>
  <text class="lbl" x="813" y="88" text-anchor="middle">报告落库</text>
  <text class="sub" x="813" y="110" text-anchor="middle">8 板块 + PDF</text>
  <text class="sub" x="813" y="128" text-anchor="middle">文案分析时固化</text>

  <line class="arrow" x1="148" y1="103" x2="184" y2="103"/>
  <line class="arrow" x1="336" y1="103" x2="372" y2="103"/>
  <line class="arrow" x1="526" y1="103" x2="562" y2="103"/>
  <line class="arrow" x1="706" y1="103" x2="742" y2="103"/>

  <!-- privacy guard band -->
  <rect class="guard" x="20" y="192" width="860" height="64" rx="10"/>
  <text class="guardTxt" x="450" y="219" text-anchor="middle">照片全程不出设备</text>
  <text class="sub" x="450" y="240" text-anchor="middle">API schema 物理拒绝 base64 / URL 图片字段——想传图也传不进来</text>

  <!-- guard braces up to steps 1-2 -->
  <line class="arrow" x1="148" y1="150" x2="148" y2="188" stroke-dasharray="4 4"/>
  <line class="arrow" x1="262" y1="150" x2="262" y2="188" stroke-dasharray="4 4"/>
</svg>
