<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <style>
    .side { fill: #f8fafc; stroke: #cbd5e1; }
    .hdr { fill: #0f172a; font-size: 14px; font-weight: 700; }
    .mono { fill: #0369a1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
    .box { fill: #ffffff; stroke: #cbd5e1; }
    .lbl { fill: #0f172a; font-size: 12.5px; font-weight: 600; }
    .sub { fill: #475569; font-size: 10.5px; }
    .flow { stroke: #0369a1; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .flowTxt { fill: #0369a1; font-size: 12px; font-weight: 700; }
    .obs { fill: #ffffff; stroke: #94a3b8; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0369a1"/>
    </marker>
  </defs>

  <!-- SQL Server side -->
  <rect class="side" x="20" y="30" width="370" height="200" rx="12"/>
  <text class="hdr" x="205" y="58" text-anchor="middle">SQL Server 端</text>
  <rect class="box" x="40" y="74" width="155" height="44" rx="8"/>
  <text class="lbl" x="117" y="93" text-anchor="middle">Change Tracking</text>
  <text class="sub" x="117" y="110" text-anchor="middle">变更捕获</text>
  <rect class="box" x="215" y="74" width="155" height="44" rx="8"/>
  <text class="lbl" x="292" y="93" text-anchor="middle">前置 CT 健康检查</text>
  <text class="sub" x="292" y="110" text-anchor="middle">同步前的先决条件校验</text>
  <rect class="box" x="40" y="132" width="155" height="44" rx="8"/>
  <text class="lbl" x="117" y="151" text-anchor="middle">变更状态查询 API</text>
  <text class="sub" x="117" y="168" text-anchor="middle">"同步健康吗"是一条查询</text>
  <rect class="box" x="215" y="132" width="155" height="44" rx="8"/>
  <text class="lbl" x="292" y="151" text-anchor="middle">批量读取</text>
  <text class="sub" x="292" y="168" text-anchor="middle">按批次出站</text>

  <!-- flow arrow -->
  <line class="flow" x1="398" y1="130" x2="498" y2="130"/>
  <text class="flowTxt" x="448" y="116" text-anchor="middle">变更批次</text>
  <text class="mono" x="448" y="152" text-anchor="middle">10M+ rows</text>

  <!-- Oracle side -->
  <rect class="side" x="510" y="30" width="370" height="200" rx="12"/>
  <text class="hdr" x="695" y="58" text-anchor="middle">Oracle 端</text>
  <rect class="box" x="530" y="74" width="155" height="44" rx="8"/>
  <text class="lbl" x="607" y="93" text-anchor="middle">Windows Service</text>
  <text class="sub" x="607" y="110" text-anchor="middle">常驻消费变更</text>
  <rect class="box" x="705" y="74" width="155" height="44" rx="8"/>
  <text class="lbl" x="782" y="93" text-anchor="middle">批量插入</text>
  <text class="sub" x="782" y="110" text-anchor="middle">事务化写入</text>
  <rect class="box" x="530" y="132" width="155" height="44" rx="8"/>
  <text class="lbl" x="607" y="151" text-anchor="middle">结构化错误跟踪</text>
  <text class="sub" x="607" y="168" text-anchor="middle">漂移可定位到批次</text>
  <rect class="box" x="705" y="132" width="155" height="44" rx="8"/>
  <text class="lbl" x="782" y="151" text-anchor="middle">邮件报警</text>
  <text class="sub" x="782" y="168" text-anchor="middle">任何漂移立即通知</text>

  <!-- observability band -->
  <rect class="obs" x="20" y="252" width="860" height="50" rx="10"/>
  <text class="lbl" x="450" y="273" text-anchor="middle">早期：又慢又偶尔丢数据 → 最终：快速且在构造上不可能丢</text>
  <text class="sub" x="450" y="292" text-anchor="middle">每一阶段可观测 —— 排障从"一次调查"变成"一条状态查询"</text>
</svg>
