<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="ui-sans-serif, system-ui, 'Microsoft YaHei', sans-serif">
  <style>
    .side { fill: #f8fafc; stroke: #cbd5e1; }
    .hdr { fill: #0f172a; font-size: 14px; font-weight: 700; }
    .box { fill: #ffffff; stroke: #cbd5e1; }
    .warn { fill: #fffbeb; stroke: #f59e0b; }
    .lbl { fill: #0f172a; font-size: 12px; font-weight: 600; }
    .sub { fill: #475569; font-size: 10.5px; }
    .flow { stroke: #0369a1; stroke-width: 2.5; fill: none; marker-end: url(#a); }
    .flowTxt { fill: #0369a1; font-size: 11px; font-weight: 700; }
    .note { fill: #0369a1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0369a1"/>
    </marker>
  </defs>

  <!-- Row-level lane -->
  <rect class="side" x="16" y="22" width="868" height="150" rx="12"/>
  <text class="hdr" x="36" y="48">行级失败</text>
  <text class="sub" x="110" y="48">row-level · 个别行与目标冲突，不拖累其余行</text>
  <rect class="box" x="36" y="66" width="176" height="52" rx="8"/>
  <text class="lbl" x="124" y="87" text-anchor="middle">约束冲突 · 值超宽</text>
  <text class="sub" x="124" y="104" text-anchor="middle">constraint / width</text>
  <rect class="box" x="252" y="66" width="176" height="52" rx="8"/>
  <text class="lbl" x="340" y="87" text-anchor="middle">重试条目 · 按行计数</text>
  <text class="sub" x="340" y="104" text-anchor="middle">per-row retry count</text>
  <rect class="box" x="468" y="66" width="196" height="52" rx="8"/>
  <text class="lbl" x="566" y="87" text-anchor="middle">独立重试页出站</text>
  <text class="sub" x="566" y="104" text-anchor="middle">永不阻塞交付窗口</text>
  <rect class="warn" x="704" y="66" width="160" height="52" rx="8"/>
  <text class="lbl" x="784" y="87" text-anchor="middle">超阈值 → 弃置但保留</text>
  <text class="sub" x="784" y="104" text-anchor="middle">修复 / 重放 / 带因关闭</text>
  <line class="flow" x1="212" y1="92" x2="250" y2="92"/>
  <line class="flow" x1="428" y1="92" x2="466" y2="92"/>
  <line class="flow" x1="664" y1="92" x2="702" y2="92"/>
  <text class="sub" x="36" y="146">弃置条目是"该行与目标不一致"的唯一记录；被弃置的行不压制任何交付窗口（go-live 测试 D1 抓到的静默死表）。</text>

  <!-- Batch-level lane -->
  <rect class="side" x="16" y="188" width="868" height="130" rx="12"/>
  <text class="hdr" x="36" y="214">批级失败</text>
  <text class="sub" x="110" y="214">batch-level · 目标端、网络或客户端整体不可用</text>
  <rect class="box" x="36" y="232" width="220" height="52" rx="8"/>
  <text class="lbl" x="146" y="253" text-anchor="middle">目标宕机 · 客户端崩溃</text>
  <text class="sub" x="146" y="270" text-anchor="middle">target down / client crash</text>
  <rect class="box" x="296" y="232" width="220" height="52" rx="8"/>
  <text class="lbl" x="406" y="253" text-anchor="middle">不需要机制：游标不动</text>
  <text class="sub" x="406" y="270" text-anchor="middle">cursor untouched</text>
  <rect class="box" x="556" y="232" width="220" height="52" rx="8"/>
  <text class="lbl" x="666" y="253" text-anchor="middle">未确认 → 自动重投</text>
  <text class="sub" x="666" y="270" text-anchor="middle">re-offered on reconnect</text>
  <line class="flow" x1="256" y1="258" x2="294" y2="258"/>
  <line class="flow" x1="516" y1="258" x2="554" y2="258"/>
  <text class="sub" x="36" y="306">游标只在"连续确认段"上前进——取最高已确认位会在全局共享的暂存序列上跳过空洞。</text>

  <text class="note" x="450" y="356" text-anchor="middle">at-least-once delivery × idempotent upsert ⇒ loss impossible by construction</text>
</svg>
