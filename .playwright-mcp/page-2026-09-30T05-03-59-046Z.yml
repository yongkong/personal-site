        - heading "一个月交付：人脸型与色彩分析小程序（隐私优先）" [level=1] [ref=f4e16]
        - paragraph [ref=f4e17]: 发布于 2026年9月24日
        - generic [ref=f4e18]:
          - heading "背景" [level=2] [ref=f4e19]
          - paragraph [ref=f4e20]:
            - text: 客户需要一款微信小程序：用户拍照后分析
            - strong [ref=f4e21]: 脸型
            - text: 与
            - strong [ref=f4e22]: 个人色彩季型
            - text: ，生成可付费解锁的颜值报告（含 PDF 下载），最终为线下的化妆私教服务引流。两道硬约束从第一天就立在那里：
          - paragraph [ref=f4e23]:
            - img "小程序首页：隐私徽标与开始分析" [ref=f4e24]
          - list [ref=f4e25]:
            - listitem [ref=f4e26]:
              - strong [ref=f4e27]: 隐私
              - text: ——人脸照片绝不能上传服务器。这不是合规加分项，是产品能不能做的底线
            - listitem [ref=f4e28]:
              - strong [ref=f4e29]: 窗口
              - text: ——一个月内从需求冻结走到上线
          - paragraph [ref=f4e30]:
            - img "产品结构：首页 · 拍照分析 · 报告" [ref=f4e31]
          - heading "我的角色" [level=2] [ref=f4e32]
          - paragraph [ref=f4e33]: 独立全栈交付：需求冻结与规格文档、系统架构、算法适配、前后端实现、测试体系、交付与上线清单。最终产物不只是代码——技术方案、测试指南、真机回归清单、客户版上线准备清单，都是交付物的一部分。约 2.6 万行：后端 9.3k（Python/FastAPI）+ 前端 16.4k（uniapp/Vue3/TS）。
          - heading "技术决策" [level=2] [ref=f4e34]
          - paragraph [ref=f4e35]:
            - strong [ref=f4e36]: 隐私优先管线
            - text: 是整个产品的地基：拍照后
            - code [ref=f4e37]: wx.faceDetect
            - text: 在端侧提取 106 个关键点与 3 区肤色 RGB，组成不到 1KB 的特征数据上报，临时文件立即清理。后端 API 用 schema 校验
            - strong [ref=f4e38]: 物理拒绝
            - text: base64/URL 图片字段——不是"约定不传"，是
            - strong [ref=f4e39]: 想传也传不进来
            - text: 。
          - paragraph [ref=f4e40]:
            - img "隐私数据管线" [ref=f4e41]
          - paragraph [ref=f4e42]:
            - strong [ref=f4e43]: 算法层做成适配器接口
            - text: （脸型/肤色/推荐三个模块可独立替换）：36 关键点匹配 7 类脸型模板叠加三庭五眼比例；侧脸 9 点算鼻突比与面部凸角得到"折叠度"（侧脸立体度，按甲方要求只出高/中/低档不展示分数）；3 区 RGB 经 IQR 去异常后转 HSV/Lab 判定春/夏/秋/冬季型。
          - paragraph [ref=f4e44]:
            - strong [ref=f4e45]: 商业闭环一步到位
            - text: ：
          - paragraph [ref=f4e46]:
            - img "付费与引流闭环" [ref=f4e47]
          - paragraph [ref=f4e48]: 免费版只给 3 项钩子，¥19.9 解锁完整八板块报告（PDF 同款排版可下载），末尾落到私教预约：
          - paragraph [ref=f4e49]:
            - img "报告八板块结构" [ref=f4e50]
          - paragraph [ref=f4e51]:
            - text: 工程上几个值得说的决定：
            - code [ref=f4e52]: MOCK_WECHAT
            - text: 开关让登录/支付/退款在无微信凭证的本地全自动跑通，切真实链路前端无感；PDF 排版用 WeasyPrint、缺 Pango 运行库时自动降级 fpdf2 纯 Python 绘制；管理端在线改配置——甲方 0903 版内容迭代（文案红线、板块调整）
            - strong [ref=f4e53]: 没有改一行代码
            - text: 。
          - paragraph [ref=f4e54]:
            - strong [ref=f4e55]: 把内容规则当工程约束
            - text: ：与甲方共同冻结了文案红线（禁负面外貌字眼、比例数据一律正向解读）、文案落库于分析时、老报告不回溯——写进了领域术语表，让"怎么说话"和"怎么写代码"有同一份事实源。
